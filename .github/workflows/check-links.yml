name: Check links

# Every Code and Live URL is derived from the `repo` slug, so one typo breaks a card with no
# visible sign on the page. This catches that before it ships, and on a schedule catches repos
# that get renamed, deleted or have Pages switched off later.
on:
  push:
    branches: [main]
    paths: ['index.html', 'scripts/**', '.github/workflows/check-links.yml']
  pull_request:
    paths: ['index.html', 'scripts/**', '.github/workflows/check-links.yml']
  schedule:
    - cron: '30 6 * * 1'   # Mondays, just after the date refresh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Check every Code and Live link
        env:
          # Lifts the repo-list call from 60/hr (anonymous, shared across every runner on the
          # same egress IP) to 1000/hr. Without it this step is at the mercy of whatever else
          # is hitting the API from the same address.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-links.mjs
